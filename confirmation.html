<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci - Mouratoglou Academy</title>
<style>
  @font-face{ font-family:'Beni M'; font-weight:700; font-style:normal; font-display:swap; src:url('Beni M/BeniM-Bold.otf') format('opentype'); }
  @font-face{ font-family:'Geometria'; font-weight:400; font-style:normal; font-display:swap; src:url('Geometria/Geometria-Regular.otf') format('opentype'); }

  :root{
    --ground: #050d18;
    --surface: #0d1c30;
    --ink: #eef3fa;
    --ink-soft: #93a8c2;
    --clay: #1f92f0;
    --line: #1f3552;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--ground);
    background:
      radial-gradient(ellipse 900px 560px at 50% -10%, color-mix(in srgb, white 18%, transparent), transparent 72%),
      var(--ground);
    color:var(--ink);
    font-family:'Geometria', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
  }

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:32rem;
  }

  img.logo{
    height:clamp(48px,7vw,64px); width:auto;
    margin-bottom:clamp(36px,8vw,56px);
  }

  .check{
    width:64px; height:64px;
    border-radius:50%;
    border:2px solid var(--clay);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:28px;
  }
  .check svg{ width:28px; height:28px; }

  h1{
    font-family:'Beni M', Georgia, serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(5.2rem,18vw,8.4rem);
    line-height:1;
    margin:0;
    letter-spacing:-.01em;
  }
  h1 em{ font-style:normal; color:var(--clay); }

  p{
    margin:20px 0 0;
    font-size:1.1rem;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:34ch;
  }


  @media (prefers-reduced-motion:no-preference){
    .reveal{ animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .reveal-1{ animation-delay:.05s; }
    .reveal-2{ animation-delay:.16s; }
    .reveal-3{ animation-delay:.27s; }
    .reveal-4{ animation-delay:.38s; }
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

  @media (max-width:480px){
    h1{ font-size:4.4rem; }
    p{ font-size:1rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo reveal reveal-1" src="Logo/Logo MA I French Riviera - Horizontal - White-trimmed.png" alt="Mouratoglou Academy - French Riviera">
    <div class="check reveal reveal-2" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#1f92f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 id="title" class="reveal reveal-3">Merci<em>.</em></h1>
    <p id="message" class="reveal reveal-3">Vous êtes bien inscrit·e. Vous serez parmi les premiers informés dès l'ouverture des réservations.</p>
  </div>

  <script>
    var translations = {
      fr: {
        title: 'Merci<em>.</em>',
        message: "Vous êtes bien inscrit·e. Vous serez parmi les premiers informés dès l'ouverture des réservations."
      },
      en: {
        title: 'Thank you<em>.</em>',
        message: "You're all set. You'll be among the first to know as soon as reservations open."
      },
      it: {
        title: 'Grazie<em>.</em>',
        message: "Sei registrato/a. Sarai tra i primi a saperlo non appena le prenotazioni saranno aperte."
      }
    };
    var params = new URLSearchParams(window.location.search);
    var lang = params.get('lang');
    if (!lang || !translations[lang]){
      try { lang = localStorage.getItem('ma-lang') || 'fr'; } catch(e) { lang = 'fr'; }
    }
    if (!translations[lang]) lang = 'fr';
    document.documentElement.lang = lang;
    var dict = translations[lang];
    document.getElementById('title').innerHTML = dict.title;
    document.getElementById('message').textContent = dict.message;
  </script>
</body>
</html>
